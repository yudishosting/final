<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
    <!-- Canvas untuk background Scorpio -->
    <canvas id="backgroundCanvas"></canvas>
    
    <!-- Background blur dari album art -->
    <div class="background-blur" id="backgroundBlur"></div>
    
    <div class="welcome-panel" id="welcomePanel">
        <div class="welcome-content">
            <h2>Selamat Datang di Music Player</h2>
            <p>Gunakan headphone untuk pengalaman terbaik</p>
            <button id="startButton">Mulai Mendengarkan</button>
        </div>
    </div>
    
    <div class="player-container">
        <h1 id="playlistTitle" class="playlist-title">Playlist</h1>
        
        <div class="album-art">
            <img id="albumArt" src="placeholder.jpg" alt="Album Art">
        </div>
        
        <div class="player-info">
            <h2 id="songTitle">Song Title</h2>
            <p id="artist">Artist</p>
        </div>
        
        <div class="controls">
            <button id="shuffleBtn" class="control-btn" title="Putar Acak">
                <i class="fas fa-shuffle"></i>
            </button>
            <button id="prevBtn" class="control-btn">
                <i class="fas fa-backward"></i>
            </button>
            <button id="playPauseBtn" class="control-btn large-btn">
                <i class="fas fa-play"></i>
            </button>
            <button id="nextBtn" class="control-btn">
                <i class="fas fa-forward"></i>
            </button>
            <button id="playlistToggleBtn" class="control-btn" title="Pilih Lagu">
                <i class="fas fa-list"></i>
            </button>
        </div>
        
        <div class="progress-container">
            <span id="currentTime">0:00</span>
            <input type="range" id="progressBar" min="0" max="100" value="0">
            <span id="duration">0:00</span>
        </div>
        
        <div class="lyrics-container">
            <p id="currentLyric" class="active-lyric"></p>
            <p id="nextLyric" class="upcoming-lyric"></p>
            <p id="futureLyric" class="upcoming-lyric"></p>
        </div>

        <div class="playlist-panel hidden" id="playlistPanel">
            <h3>Daftar Lagu</h3>
            <div id="songList" class="song-list">
            </div>
        </div>
    </div>
    
    <audio id="audio"></audio>
    <script type="module" src="background.js"></script>
    <script src="script.js"></script> 
</body>
</html>
