<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
    <canvas id="backgroundCanvas"></canvas>
    
    <div class="background-blur" id="backgroundBlur"></div>
    <div class="background-blur" id="backgroundBlur2"></div>
    
    <div class="welcome-panel" id="welcomePanel">
        <div class="welcome-content">
            <h2>Selamat Datang di Music Player</h2>
            <p>Gunakan headphone untuk pengalaman terbaik</p>
            <button id="startButton">Mulai Mendengarkan</button>
        </div>
    </div>

    <header class="main-header">
        <h1 class="header-title">Now Playing</h1>
    </header>
    
    <div class="playlist-panel" id="playlistPanel">
        <h3>Daftar Lagu</h3>
        <div id="songList" class="song-list"></div>
    </div>
    <div class="playlist-backdrop" id="playlistBackdrop"></div>
    
    <div class="player-container">
        <div class="album-art">
            <img id="albumArt" src="placeholder.jpg" alt="Album Art">
        </div>
        
        <div class="player-info">
            <h2 id="songTitle">Song Title</h2>
            <p id="artist">Artist</p>
        </div>
        
        <div class="controls">
            <button id="shuffleBtn" class="control-btn" title="Putar Acak">
                <i class="fas fa-shuffle"></i>
            </button>
            <button id="prevBtn" class="control-btn">
                <i class="fas fa-backward"></i>
            </button>
            <button id="playPauseBtn" class="control-btn large-btn">
                <i class="fas fa-play"></i>
            </button>
            <button id="nextBtn" class="control-btn">
                <i class="fas fa-forward"></i>
            </button>
            <button id="playlistToggleBtn" class="control-btn" title="Jelajahi Musik">
                <i class="fas fa-list-ul"></i>
            </button>
        </div>
        
        <div class="progress-container">
            <span id="currentTime">0:00</span>
            <input type="range" id="progressBar" min="0" max="100" value="0">
            <span id="duration">0:00</span>
        </div>
        
        <div class="lyrics-container">
            <p id="currentLyric" class="active-lyric"></p>
            <p id="nextLyric" class="upcoming-lyric"></p>
            <p id="futureLyric" class="upcoming-lyric"></p>
        </div>
        
        <!-- Social Media Links -->
        <div class="social-links">
            <a href="https://wa.me/6285124039070" target="_blank" rel="noopener" class="social-btn whatsapp" title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a href="https://instagram.com/yudis_299" target="_blank" rel="noopener" class="social-btn instagram" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>
    
    <audio id="audio"></audio>
    <script type="module" src="background.js"></script>
    <script src="script.js"></script> 
</body>
</html>
